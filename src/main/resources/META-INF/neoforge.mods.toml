modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
logoFile="${mod_logo}"
description='''${mod_description}'''

# Kaleidoscope Cookery is required because this mod only adds data to its
# custom chopping-board recipe type and item namespace.
[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="${cookery_mod_id}"
type="required"
versionRange="${cookery_version_range}"
ordering="AFTER"
side="BOTH"
